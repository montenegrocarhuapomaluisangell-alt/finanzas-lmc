services:
  - type: web
    name: finanzas-lmc
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finanzas-lmc-db
          property: connectionString

databases:
  - name: finanzas-lmc-db
    plan: free
    databaseName: finanzas_lmc
    user: finanzas_user
